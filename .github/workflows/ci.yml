name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Swift (format + lint)
    runs-on: macos-26
    # Pinned: each SwiftFormat release turns on new default rules, so an unpinned CI goes red
    # on a tree that is clean locally. The runner image ships its own Homebrew swiftformat
    # ahead of /usr/local/bin, so the pinned binaries go first on PATH and are checked.
    env:
      SWIFTFORMAT_VERSION: 0.63.1
      SWIFTFORMAT_SHA256: 385ef1a263ba28685157b98c5536b9c9105e124518f28b7ef8a2bee4b167eaeb
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - uses: actions/checkout@v5
      - name: Install SwiftFormat ${{ env.SWIFTFORMAT_VERSION }} and SwiftLint ${{ env.SWIFTLINT_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o /tmp/swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          echo "$SWIFTFORMAT_SHA256  /tmp/swiftformat.zip" | shasum -a 256 -c -
          unzip -q -o /tmp/swiftformat.zip -d /tmp/swiftformat
          install -m 755 /tmp/swiftformat/swiftformat "$RUNNER_TEMP/bin/swiftformat"
          curl -fsSL -o /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  /tmp/swiftlint.zip" | shasum -a 256 -c -
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
          install -m 755 /tmp/swiftlint/swiftlint "$RUNNER_TEMP/bin/swiftlint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Verify pinned versions
        run: |
          test "$(swiftformat --version)" = "$SWIFTFORMAT_VERSION"
          test "$(swiftlint --version)" = "$SWIFTLINT_VERSION"
      - name: SwiftFormat (check only)
        run: swiftformat --lint .
      - name: SwiftLint
        run: swiftlint lint --quiet

  test:
    name: Shared package tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Run AdrafinilShared unit tests
        run: swift test --package-path AdrafinilShared

  build:
    name: App build (headless, unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      # Compile-only check — no signing identities on CI. The daemon/helper/CLI are embedded in the
      # app target, so building the Adrafinil scheme covers all four products.
      - name: Build Adrafinil (compile check)
        run: |
          xcodebuild -project Adrafinil.xcodeproj -scheme Adrafinil -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
